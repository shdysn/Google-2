name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK asset'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses and Install Platform
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME || true
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build environment
        run: |
          # Make Gradle wrapper executable
          chmod +x gradlew || true

          # Restore debug.keystore if base64 encoded version exists
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Ensure .env exists to prevent Secrets Gradle Plugin build failure
          touch .env
          cp .env.example .env 2>/dev/null || true
          cp .env.example app/.env 2>/dev/null || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Prepare APK artifact
        run: |
          mkdir -p output
          find app/build/outputs/apk -name "*.apk" -exec cp {} output/SmartTimetable-debug.apk \;
          if [ -f "output/SmartTimetable-debug.apk" ]; then
            echo "Successfully prepared output/SmartTimetable-debug.apk"
            ls -lh output/SmartTimetable-debug.apk
          else
            echo "Error: No APK found after build"
            find app/build -type f || true
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTimetable-debug-apk
          path: output/SmartTimetable-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Smart Timetable Build #{0}', github.run_number) }}
          body: |
            ### 📱 Smart Timetable Debug APK
            - **Build Number**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Event**: `${{ github.event_name }}`

            Download the attached `SmartTimetable-debug.apk` directly to install on your Android device.
          files: output/SmartTimetable-debug.apk
          draft: false
          prerelease: false
