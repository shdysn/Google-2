name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK asset'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK and Licenses
        run: |
          set +o pipefail
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            sudo chown -R $USER:$USER "$ANDROID_HOME" || true
            mkdir -p "$ANDROID_HOME/licenses" || true
            # Accept all standard and preview Android SDK licenses
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-license" || true
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de37312f22f840cbb5650b6129d733" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
            
            if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" 2>/dev/null || true
            fi
          fi

      - name: Prepare build environment
        run: |
          # Make Gradle wrapper executable
          chmod +x gradlew || true

          # Restore or generate debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generating standard debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure .env exists to prevent Secrets Gradle Plugin build failure
          touch .env
          cp .env.example .env 2>/dev/null || true
          cp .env.example app/.env 2>/dev/null || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Prepare APK artifact
        run: |
          mkdir -p output
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" output/SmartTimetable-debug.apk
            ls -lh output/SmartTimetable-debug.apk
          else
            echo "Error: No APK found after build"
            find app/build -type f || true
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTimetable-debug-apk
          path: output/SmartTimetable-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Smart Timetable Build #{0}', github.run_number) }}
          body: |
            ### 📱 Smart Timetable Debug APK
            - **Build Number**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Event**: `${{ github.event_name }}`

            Download the attached `SmartTimetable-debug.apk` directly to install on your Android device.
          files: output/SmartTimetable-debug.apk
          draft: false
          prerelease: false
