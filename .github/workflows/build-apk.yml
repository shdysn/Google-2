name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK asset'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          # Write license hashes directly to avoid pipefail / SIGPIPE errors
          TARGET_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses"
          mkdir -p "$TARGET_DIR"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$TARGET_DIR/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de37312f22f840cbb5650b6129d733" >> "$TARGET_DIR/android-sdk-preview-license"

      - name: Prepare build environment
        run: |
          # Ensure gradlew is executable
          chmod +x gradlew || true

          # Ensure .env exists to prevent Secrets Gradle Plugin build failure
          touch .env
          cp -f .env.example .env 2>/dev/null || true
          mkdir -p app
          cp -f .env.example app/.env 2>/dev/null || true

          # Restore or generate debug keystore
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating standard debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK with Gradle Wrapper
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Package APK
        run: |
          mkdir -p output
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" output/SmartTimetable-debug.apk
            ls -lh output/SmartTimetable-debug.apk
          else
            echo "Error: No APK file generated!"
            find app/build -type f || true
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTimetable-debug-apk
          path: output/SmartTimetable-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Smart Timetable Build #{0}', github.run_number) }}
          body: |
            ### 📱 Smart Timetable Debug APK
            - **Build Number**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`

            Download the attached `SmartTimetable-debug.apk` directly to install on your Android device.
          files: output/SmartTimetable-debug.apk
          draft: false
          prerelease: false
